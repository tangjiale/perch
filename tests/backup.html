<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>备份模拟 IPC 验证</title></head>
<body><div id="root"></div><script>
// 隔离界面夹具；所有配置为测试值，不读取真实凭据或连接 S3。
globalThis.isTauri = !new URLSearchParams(location.search).has('preview');
window.__calls = [];
window.__state = { config: { revision: 1, endpoint: 'https://s3.example.test', region: 'auto', bucket: 'perch-demo', prefix: 'backups/perch/', forcePathStyle: false, hasCredentials: true, enabled: true, cron: '0 2 * * *' }, records: [], nextRunAt: '2026-10-14T02:00:00+08:00', running: false };
window.__records = [{id:'backup-fixture', key:'backups/perch/fixture-workspace/perch-monthly-20261013T020000Z.zip', filename:'perch-monthly-20261013T020000Z.zip', size:2359296, createdAt:'2026-10-13T02:00:00Z',trigger:'manual',status:'success',monthlyArchive:true}];
const callbacks = {}; let callbackId=0; window.__listeners=[];
window.__emit=(event='backup-updated',payload=null)=>window.__listeners.filter(item=>item.event===event).forEach(item=>callbacks[item.handler]?.({event,payload}));
window.__TAURI_INTERNALS__={transformCallback:fn=>{callbacks[++callbackId]=fn;return callbackId;},unregisterCallback:id=>delete callbacks[id],invoke:async(name,args)=>{
  window.__calls.push({name,args});
  if(name==='plugin:event|listen'){window.__listeners.push({event:args.event,handler:args.handler});return window.__listeners.length;}
  if(name==='plugin:event|unlisten')return;
  if(name==='plugin:dialog|open')return window.__dialogResponses.shift();
  if(name==='plugin:dialog|save')return window.__dialogResponses.shift();
  if(name==='data_restore'){window.__state.config={...window.__state.config,prefix:'restored/',revision:0};return;}
  if(name==='backup_state')return structuredClone(window.__state);
  if(window.__fail)throw window.__fail;
  if(name==='backup_save') { const {accessKeyId,secretAccessKey,...config}=args.value;window.__state.config={...config,revision:config.revision+1,hasCredentials:!!secretAccessKey||config.hasCredentials};return structuredClone(window.__state); }
  if(name==='backup_test')return;
  if(name==='backup_refresh'){window.__state.records=structuredClone(window.__records);return structuredClone(window.__state);}
  if(name==='backup_create'){
    const record={...structuredClone(window.__records[0]),id:args.id||'backup-fixture',status:'preparing',progress:{phase:'preparing',completed:0,total:null},retryAvailable:false};
    window.__state.records=[record];window.__state.running=true;
    const emit=()=>window.__emit('backup-progress',{workspaceId:'fixture-workspace',dataRoot:'/mock/perch',record:structuredClone(record)});
    window.__advance=(phase,completed=0,total=null)=>{record.progress={phase,completed,total};record.status=['database','packing'].includes(phase)?'packing':phase==='hashing'?'uploading':phase;emit();};
    emit();
    return new Promise((resolve,reject)=>{
      window.__finishCreate=(status='success')=>{record.status=status;record.retryAvailable=status!=='success';record.error=status==='unknown'?'网络连接中断，上传结果未确认':undefined;record.progress=status==='success'?{phase:'completed',completed:1,total:1}:null;window.__state.running=false;emit();window.__emit();if(status==='success')resolve(structuredClone(window.__state));else reject(record.error||'模拟上传失败');};
      if(!window.__deferCreate)window.__finishCreate();
    });
  }
  if(name==='backup_verify'){
    const record=window.__state.records.find(r=>r.id===args.id);
    if(window.__verifyOutcome==='error')throw '核验遇到 HTTP 403，无法确认对象是否存在';
    record.status=window.__verifyOutcome==='missing'?'failed':'success';
    record.error=record.status==='failed'?'远端未找到备份，请重新上传':undefined;
    return structuredClone(window.__state);
  }
  if(name==='backup_retry'){
    const record=window.__state.records.find(r=>r.id===args.id);record.status='success';record.retryAvailable=false;record.error=undefined;return structuredClone(window.__state);
  }
  if(name==='backup_download'){
    if(window.__deferDownload)return new Promise((resolve,reject)=>{window.__finishDownload=(error)=>error?reject(error):resolve();});
    return;
  }
  if(name==='backup_restore')return {dataRoot:'/mock/restored',defaultRoot:'/mock/perch',workspaceId:'fixture-workspace',version:'test'};
  throw Error('未知模拟命令 '+name);
}};
</script><script type="module" src="./BackupFixture.tsx"></script></body></html>
