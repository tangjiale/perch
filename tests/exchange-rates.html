<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>汇率转换模拟验收</title></head>
<body><div id="root" style="min-height:100vh;padding:24px"></div>
<script>
// 完全模拟公共汇率 IPC，不请求外部服务、不读取原生数据。
globalThis.isTauri = !new URLSearchParams(location.search).has('preview');
window.__calls=[]; window.__pending=[]; window.__mode=new URLSearchParams(location.search).get('mode') || 'success';
window.__snapshot=base=>{const anchors={CNY:7,USD:1,EUR:0.9,HKD:7.8,JPY:150,GBP:0.8,AUD:1.5,CAD:1.4,SGD:1.3,KRW:1300,CHF:0.88,NZD:1.6,TWD:32,THB:35,MYR:4.5,IDR:15500,INR:83,AED:3.67,MOP:8,VND:24000};return {base,rates:Object.fromEntries(Object.entries(anchors).map(([code,value])=>[code,value/anchors[base]])),updatedAt:new Date().toISOString(),nextUpdateAt:new Date(Date.now()+86400000).toISOString(),fetchedAt:new Date().toISOString(),provider:'ExchangeRate-API mock'};};
window.__TAURI_INTERNALS__={invoke:async(name,args)=>{window.__calls.push({name,args});if(name!=='get_exchange_rates')throw Error('非预期命令 '+name);if(window.__mode==='fail')throw '模拟汇率查询失败';if(window.__mode==='pending')return new Promise((resolve,reject)=>window.__pending.push({base:args.base,resolve,reject}));return window.__snapshot(args.base);}};
</script><script type="module" src="./ExchangeRatesFixture.tsx"></script></body></html>
