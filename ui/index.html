<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>个人工作台 · 界面设计预览</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="models.css">
  <link rel="stylesheet" href="agents.css">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="projects.css">
  <link rel="stylesheet" href="skills.css">
  <link rel="stylesheet" href="knowledge.css">
  <link rel="stylesheet" href="resources.css">
  <link rel="stylesheet" href="refinement.css">
  <script defer src="assets/lucide.min.js"></script>
  <script defer src="secondary.js"></script>
  <script defer src="categories.js"></script>
  <script defer src="ai-store.js"></script>
  <script defer src="resource-store.js"></script>
  <script defer src="assets/js-yaml.min.js"></script>
  <script defer src="skills.js"></script>
  <script defer src="knowledge.js"></script>
  <script defer src="models.js"></script>
  <script defer src="agents.js"></script>
  <script defer src="chat.js"></script>
  <script defer src="project-store.js"></script>
  <script defer src="projects.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="windowbar"><div class="traffic" aria-hidden="true"><b></b><b></b><b></b></div><span>个人工作台</span><span class="window-platform">Workbench</span></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a href="#overview" class="brand"><span class="brandmark"><i data-lucide="panels-top-left"></i></span><div><span class="brand-title-row"><span>个人工作台</span><span class="brand-version" id="brand-version">v0.1.0</span></span><small>WORKBENCH</small></div></a>
      <nav id="navigation"></nav>
      <div class="nav-label">任务来源</div>
      <button class="source-nav" data-action="source" data-source="personal"><span class="dot blue"></span>个人任务 <span id="personal-count"></span></button>
      <button class="source-nav" data-action="source" data-source="zentao"><span class="dot amber"></span>禅道执行 <span id="zentao-count"></span></button>
      <div class="sidebar-bottom"><a class="nav-item" href="#settings"><i data-lucide="settings-2"></i><span>设置与连接</span></a><div class="identity"><div class="avatar">我</div><div>我的工作空间<small>本地个人空间</small></div><i data-lucide="chevrons-up-down"></i></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span>我的空间</span><i data-lucide="chevron-right"></i><b id="page-crumb">总览</b></div><label class="global-search"><i data-lucide="search"></i><input id="global-search" placeholder="搜索任务、执行或应用" aria-label="全局搜索"></label><span class="demo-label"><span class="dot"></span>示例数据</span><button class="btn primary" data-action="new-task"><i data-lucide="plus"></i>新建任务</button></header>
      <main id="main"></main>
      <footer class="statusbar"><span><span class="dot green"></span>本地工作空间</span><span>禅道未连接 <span class="status-separator">/</span> 开源版 22.0</span></footer>
    </div>
  </div>
  <div id="overlay-root"></div><div id="toast" role="status"></div>
</body>
</html>
